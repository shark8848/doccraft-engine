global
    log stdout format raw local0
    maxconn 2048

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 15s

frontend doccraft_web
    bind 0.0.0.0:5290
    default_backend doccraft_api

backend doccraft_api
    option httpchk GET /healthz
    http-check expect status 200
    server api 127.0.0.1:8100 check inter 2s fall 3 rise 2

listen stats
    bind 0.0.0.0:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends
